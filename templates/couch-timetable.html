<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Timetable - HJSS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/timetable.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <section class="quick-navigation">
        <nav>
        <ul>
            <li id="button"><a href="/">Home</a></li>
            <li id="button"><a href="/timetable-grade">Grade Timetable</a></li>
            <li id="button"><a href="/timetable-coach">Coach Timetable</a></li>
            <li id="button"><a href="/mee">Students</a></li>
        </ul>
        </nav>
    </section>
    <header class="profile-header">
        <form method="POST" enctype="multipart/form-data">
            <label for="fileInput" class="upload-label">
                <img src="/static/images/user.png" alt="User Icon" />
            </label>
            
        </form>
        <h1>{{ username }}  - Couch</h1>
    </header>

    <h1>Weekly Lesson Timetable</h1>

    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>Time Slot</th>
                <th>Grade</th>
                <th>Coach</th>
                <th>Max Learners</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>4–5 PM</td>
                <td>1</td>
                <td>Coach Alice</td>
                <td>4</td>
            </tr>
            <tr>
                <td>Monday</td>
                <td>5–6 PM</td>
                <td>2</td>
                <td>Coach Bob</td>
                <td>4</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>6–7 PM</td>
                <td>3</td>
                <td>Coach Alice</td>
                <td>4</td>
            </tr>
            <tr>
                <td>Saturday</td>
                <td>2–3 PM</td>
                <td>5</td>
                <td>Coach Charlie</td>
                <td>4</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
